<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the knot stroke -->
    <linearGradient id="knotGrad3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb000"/>
      <stop offset="50%" stop-color="#ffd966"/>
      <stop offset="100%" stop-color="#ffb000"/>
    </linearGradient>

    <!-- Darker shade for "under" segments to add depth -->
    <linearGradient id="knotGradUnder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cc8800"/>
      <stop offset="50%" stop-color="#e6a800"/>
      <stop offset="100%" stop-color="#cc8800"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="knotGlow3d" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shadow for depth on "over" strands -->
    <filter id="overShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.5" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!--
    Trefoil knot with 3D over/under crossings
    The knot is drawn in layers: under strands first, then over strands
    Gaps at crossings create the illusion of depth
  -->

  <!-- UNDER STRANDS (drawn first, darker, no shadow) -->

  <!-- Under at crossing near top-right -->
  <path
    d="M 80.58 31.79 C 80.12 31.50 78.82 30.53 77.82 30.04 C 76.83 29.54 75.74 29.14 74.60 28.84 C 73.46 28.54 72.24 28.34 70.99 28.25 C 69.73 28.16 68.42 28.17 67.09 28.29 C 65.76 28.42 64.38 28.65 63.00 29.00 C 61.62 29.35 60.22 29.80 58.83 30.37 C 57.44 30.93 56.05 31.60 54.68 32.37 C 53.32 33.15 51.97 34.03 50.66 35.00 C 49.36 35.97 48.08 37.04 46.86 38.19 C 45.65 39.33 43.96 41.26 43.38 41.88"
    fill="none"
    stroke="url(#knotGradUnder)"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- Under at crossing near top-left -->
  <path
    d="M 56.62 41.88 C 56.04 41.26 54.35 39.33 53.14 38.19 C 51.92 37.04 50.64 35.97 49.34 35.00 C 48.03 34.03 46.68 33.15 45.32 32.37 C 43.95 31.60 42.56 30.93 41.17 30.37 C 39.78 29.80 38.38 29.35 37.00 29.00 C 35.62 28.65 34.24 28.42 32.91 28.29 C 31.58 28.17 30.27 28.16 29.01 28.25 C 27.76 28.34 26.54 28.54 25.40 28.84 C 24.26 29.14 23.17 29.54 22.18 30.04 C 21.18 30.53 19.88 31.50 19.42 31.79"
    fill="none"
    stroke="url(#knotGradUnder)"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- Under at crossing near bottom -->
  <path
    d="M 54.81 93.09 C 55.29 92.84 56.78 92.20 57.71 91.58 C 58.63 90.96 59.53 90.22 60.36 89.38 C 61.19 88.54 61.97 87.59 62.68 86.55 C 63.38 85.51 64.03 84.37 64.58 83.15 C 65.14 81.93 65.63 80.62 66.02 79.26 C 66.41 77.89 66.71 76.45 66.92 74.97 C 67.12 73.48 67.24 71.93 67.25 70.37 C 67.26 68.80 67.18 67.19 66.99 65.58 C 66.80 63.96 66.52 62.32 66.13 60.69 C 65.74 59.07 64.92 56.64 64.67 55.83"
    fill="none"
    stroke="url(#knotGradUnder)"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- OVER STRANDS (drawn on top, brighter, with shadow) -->

  <!-- Over strand: top-right arc -->
  <path
    d="M 58.05 67.29 C 58.88 67.10 61.39 66.60 62.99 66.12 C 64.59 65.64 66.16 65.07 67.65 64.43 C 69.14 63.78 70.59 63.05 71.94 62.26 C 73.29 61.46 74.57 60.59 75.75 59.67 C 76.93 58.75 78.03 57.76 79.02 56.74 C 80.00 55.72 80.90 54.65 81.67 53.56 C 82.45 52.47 83.11 51.33 83.66 50.20 C 84.21 49.07 84.64 47.91 84.96 46.78 C 85.27 45.64 85.46 44.49 85.53 43.39 C 85.61 42.28 85.42 40.67 85.39 40.12"
    fill="none"
    stroke="url(#knotGrad3d)"
    stroke-width="5"
    stroke-linecap="round"
    filter="url(#overShadow)"
  />

  <!-- Over strand: left side down -->
  <path
    d="M 35.33 55.83 C 35.08 56.64 34.26 59.07 33.87 60.69 C 33.48 62.32 33.20 63.96 33.01 65.58 C 32.82 67.19 32.74 68.80 32.75 70.37 C 32.76 71.93 32.88 73.48 33.08 74.97 C 33.29 76.45 33.59 77.89 33.98 79.26 C 34.37 80.62 34.86 81.93 35.42 83.15 C 35.97 84.37 36.62 85.51 37.32 86.55 C 38.03 87.59 38.81 88.54 39.64 89.38 C 40.47 90.22 41.37 90.96 42.29 91.58 C 43.22 92.20 44.71 92.84 45.19 93.09"
    fill="none"
    stroke="url(#knotGrad3d)"
    stroke-width="5"
    stroke-linecap="round"
    filter="url(#overShadow)"
  />

  <!-- Over strand: top-left arc -->
  <path
    d="M 14.61 40.12 C 14.58 40.67 14.39 42.28 14.47 43.39 C 14.54 44.49 14.73 45.64 15.04 46.78 C 15.36 47.91 15.79 49.07 16.34 50.20 C 16.89 51.33 17.55 52.47 18.33 53.56 C 19.10 54.65 20.00 55.72 20.98 56.74 C 21.97 57.76 23.07 58.75 24.25 59.67 C 25.43 60.59 26.71 61.46 28.06 62.26 C 29.41 63.05 30.86 63.78 32.35 64.43 C 33.84 65.07 35.41 65.64 37.01 66.12 C 38.61 66.60 41.12 67.10 41.95 67.29"
    fill="none"
    stroke="url(#knotGrad3d)"
    stroke-width="5"
    stroke-linecap="round"
    filter="url(#overShadow)"
  />

  <!-- Center node with glow -->
  <circle cx="50" cy="58" r="6" fill="#4ecdc4">
    <animate attributeName="r" values="5.5;6.5;5.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Inner highlight -->
  <circle cx="48" cy="56" r="2" fill="#7eeee6" opacity="0.9"/>
</svg>
