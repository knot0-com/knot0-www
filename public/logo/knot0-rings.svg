<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Bright golden gradient matching the reference image -->
    <linearGradient id="ringGoldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="15%" stop-color="#ffee58"/>
      <stop offset="40%" stop-color="#ffc107"/>
      <stop offset="70%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#ef6c00"/>
    </linearGradient>

    <!-- Darker gold for under segments -->
    <linearGradient id="ringGoldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="25%" stop-color="#ffb300"/>
      <stop offset="55%" stop-color="#ff8f00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <!-- Subtle shadow -->
    <filter id="ringsShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.5" dy="1" stdDeviation="0.8" flood-color="#7f3f00" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ========== UNDER SEGMENTS (darker, drawn first) ========== -->

  <!-- Top-left ring UNDER (passes under top-right at center-top) -->
  <path d="M 48 45 Q 55 38, 55 30 Q 55 23, 45 23 Q 35 23, 28 30"
        fill="none" stroke="url(#ringGoldDark)" stroke-width="7" stroke-linecap="round"/>

  <!-- Bottom ring UNDER (passes under top-left at left side) -->
  <path d="M 28 55 Q 22 58, 25 65 Q 28 72, 38 74"
        fill="none" stroke="url(#ringGoldDark)" stroke-width="7" stroke-linecap="round"/>

  <!-- Top-right ring UNDER (passes under bottom at right side) -->
  <path d="M 72 55 Q 78 58, 75 65 Q 72 72, 62 74"
        fill="none" stroke="url(#ringGoldDark)" stroke-width="7" stroke-linecap="round"/>

  <!-- ========== OVER SEGMENTS (brighter, with shadow) ========== -->

  <!-- Top-right ring OVER (passes over top-left at center-top) -->
  <path d="M 52 45 Q 45 38, 45 30 Q 45 23, 55 23 Q 65 23, 72 30 Q 79 37, 79 45 Q 79 53, 72 55"
        fill="none" stroke="url(#ringGoldBright)" stroke-width="7" stroke-linecap="round"
        filter="url(#ringsShadow)"/>

  <!-- Top-left ring OVER (passes over bottom at left side) -->
  <path d="M 28 30 Q 21 37, 21 45 Q 21 53, 28 55 Q 35 57, 42 52 Q 49 47, 48 45"
        fill="none" stroke="url(#ringGoldBright)" stroke-width="7" stroke-linecap="round"
        filter="url(#ringsShadow)"/>

  <!-- Bottom ring OVER (passes over top-right at right side) -->
  <path d="M 38 74 Q 48 76, 50 76 Q 60 76, 62 74 Q 72 72, 75 65 Q 78 58, 72 55 Q 66 52, 58 52 Q 50 52, 42 52"
        fill="none" stroke="url(#ringGoldBright)" stroke-width="7" stroke-linecap="round"
        filter="url(#ringsShadow)"/>

  <!-- ========== HIGHLIGHT LINES ========== -->
  <g stroke="#fffde7" stroke-width="1.5" fill="none" opacity="0.45" stroke-linecap="round">
    <path d="M 54 43 Q 47 37, 47 31 Q 47 25, 55 25 Q 63 25, 69 31 Q 75 37, 75 44"/>
    <path d="M 30 31 Q 24 37, 24 44 Q 24 51, 30 54"/>
    <path d="M 40 73 Q 48 74, 50 74 Q 58 74, 60 73"/>
  </g>
</svg>
