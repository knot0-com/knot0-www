<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the knot stroke -->
    <linearGradient id="knotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb000"/>
      <stop offset="50%" stop-color="#ffd966"/>
      <stop offset="100%" stop-color="#ffb000"/>
    </linearGradient>

    <!-- Dark background for over/under gaps -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>

    <!-- Glow filter for center node -->
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft shadow -->
    <filter id="softShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <!-- Mask for over/under effect - creates gaps at crossings -->
    <mask id="crossingMask">
      <rect width="100" height="100" fill="white"/>
      <!-- Gap at crossing 1 (top-right) -->
      <ellipse cx="62" cy="42" rx="6" ry="8" fill="black" transform="rotate(-30 62 42)"/>
      <!-- Gap at crossing 2 (bottom) -->
      <ellipse cx="50" cy="75" rx="6" ry="8" fill="black"/>
      <!-- Gap at crossing 3 (top-left) -->
      <ellipse cx="38" cy="42" rx="6" ry="8" fill="black" transform="rotate(30 38 42)"/>
    </mask>
  </defs>

  <!-- Over strand shadow layer -->
  <g filter="url(#softShadow)">
    <!-- Strand that goes OVER at crossing 1 (right side going down) -->
    <path
      d="M 71.70 28.31 C 69.04 28.04 65.96 28.25 63.00 29.00 C 60.04 29.75 56.83 31.07 53.91 32.83 C 50.99 34.58 48.03 36.92 45.50 39.53 C 42.98 42.14 40.60 45.28 38.74 48.50"
      fill="none"
      stroke="#ffb000"
      stroke-width="5"
      stroke-linecap="round"
    />

    <!-- Strand that goes OVER at crossing 2 (left side going down) -->
    <path
      d="M 28.30 28.31 C 30.96 28.04 34.04 28.25 37.00 29.00 C 39.96 29.75 43.17 31.07 46.09 32.83 C 49.01 34.58 51.97 36.92 54.50 39.53 C 57.02 42.14 59.40 45.28 61.26 48.50"
      fill="none"
      stroke="#ffb000"
      stroke-width="5"
      stroke-linecap="round"
    />

    <!-- Strand that goes OVER at crossing 3 (bottom loop) -->
    <path
      d="M 38.74 48.50 C 36.88 51.72 35.35 55.35 34.35 58.84 C 33.36 62.34 32.81 66.07 32.75 69.47 C 32.69 72.88 33.15 76.32 33.98 79.26 C 34.81 82.20 36.17 84.97 37.73 87.13 C 39.30 89.30 41.32 91.09 43.36 92.23 C 45.41 93.38 47.79 94.00 50.00 94.00 C 52.21 94.00 54.59 93.38 56.64 92.23 C 58.68 91.09 60.70 89.30 62.27 87.13 C 63.83 84.97 65.19 82.20 66.02 79.26 C 66.85 76.32 67.31 72.88 67.25 69.47 C 67.19 66.07 66.64 62.34 65.65 58.84 C 64.65 55.35 63.12 51.72 61.26 48.50"
      fill="none"
      stroke="#ffb000"
      stroke-width="5"
      stroke-linecap="round"
    />
  </g>

  <!-- Under strands (masked to create gaps) -->
  <g mask="url(#crossingMask)">
    <path
      d="M 50.00 68.00 C 53.72 68.00 57.62 67.51 61.15 66.63 C 64.68 65.75 68.18 64.35 71.16 62.70 C 74.14 61.05 76.88 58.93 79.02 56.74 C 81.15 54.55 82.87 51.99 83.96 49.56 C 85.05 47.12 85.59 44.47 85.56 42.13 C 85.53 39.79 84.88 37.42 83.77 35.50 C 82.67 33.58 80.94 31.83 78.93 30.64 C 76.92 29.44 74.35 28.58 71.70 28.31"
      fill="none"
      stroke="#cc8800"
      stroke-width="4"
      stroke-linecap="round"
    />
    <path
      d="M 28.30 28.31 C 25.65 28.58 23.08 29.44 21.07 30.64 C 19.06 31.83 17.33 33.58 16.23 35.50 C 15.12 37.42 14.47 39.79 14.44 42.13 C 14.41 44.47 14.95 47.12 16.04 49.56 C 17.13 51.99 18.85 54.55 20.98 56.74 C 23.12 58.93 25.86 61.05 28.84 62.70 C 31.82 64.35 35.32 65.75 38.85 66.63 C 42.38 67.51 46.28 68.00 50.00 68.00"
      fill="none"
      stroke="#cc8800"
      stroke-width="4"
      stroke-linecap="round"
    />
  </g>

  <!-- Center node with pulsing glow -->
  <circle
    cx="50"
    cy="58"
    r="7"
    fill="#4ecdc4"
    filter="url(#nodeGlow)"
  >
    <animate
      attributeName="r"
      values="6;7;6"
      dur="2s"
      repeatCount="indefinite"
    />
  </circle>

  <!-- Inner highlight -->
  <circle
    cx="48"
    cy="56"
    r="2.5"
    fill="#7eeee6"
    opacity="0.9"
  />

  <!-- Outer glow ring -->
  <circle
    cx="50"
    cy="58"
    r="11"
    fill="none"
    stroke="#4ecdc4"
    stroke-width="1"
    opacity="0.3"
  >
    <animate
      attributeName="r"
      values="10;13;10"
      dur="2s"
      repeatCount="indefinite"
    />
    <animate
      attributeName="opacity"
      values="0.3;0.1;0.3"
      dur="2s"
      repeatCount="indefinite"
    />
  </circle>
</svg>
