  <path
    d="M 35.33 55.83 C 35.08 56.64 34.26 59.07 33.87 60.69 C 33.48 62.32 33.20 63.96 33.01 65.58 C 32.82 67.19 32.74 68.80 32.75 70.37 C 32.76 71.93 32.88 73.48 33.08 74.97 C 33.29 76.45 33.59 77.89 33.98 79.26 C 34.37 80.62 34.86 81.93 35.42 83.15 C 35.97 84.37 36.62 85.51 37.32 86.55 C 38.03 87.59 38.81 88.54 39.64 89.38 C 40.47 90.22 41.37 90.96 42.29 91.58 C 43.22 92.20 44.71 92.84 45.19 93.09"
    fill="none" stroke="url(#ropeOver)" stroke-width="8" stroke-linecap="round" filter="url(#overShadow)"
  />
  <!-- Over 3: Left side going up from bottom to center -->
  <path
    d="M 14.61 40.12 C 14.58 40.67 14.39 42.28 14.47 43.39 C 14.54 44.49 14.73 45.64 15.04 46.78 C 15.36 47.91 15.79 49.07 16.34 50.20 C 16.89 51.33 17.55 52.47 18.33 53.56 C 19.10 54.65 20.00 55.72 20.98 56.74 C 21.97 57.76 23.07 58.75 24.25 59.67 C 25.43 60.59 26.71 61.46 28.06 62.26 C 29.41 63.05 30.86 63.78 32.35 64.43 C 33.84 65.07 35.41 65.64 37.01 66.12 C 38.61 66.60 41.12 67.10 41.95 67.29"
    fill="none" stroke="url(#ropeOver)" stroke-width="8" stroke-linecap="round" filter="url(#overShadow)"
  />

  <!-- Highlight lines for rope texture -->
  <g opacity="0.3" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M 58 66 C 62 65 68 63 72 61 C 76 59 80 55 83 50 C 85 46 86 42 85.5 40"/>
    <path d="M 35 56 C 34 59 33 65 33 70 C 33 76 34 82 37 87 C 40 90 43 92 45 93"/>
    <path d="M 15 40 C 15 45 16 50 19 54 C 22 58 26 61 30 63 C 34 65 39 67 42 67"/>
  </g>
</svg>
