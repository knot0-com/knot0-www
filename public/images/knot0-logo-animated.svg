<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <style>
    .knot-path {
      stroke: #ffb000;
      stroke-width: 2.5;
      stroke-linecap: round;
      fill: none;
      animation: morph 4s ease-in-out infinite;
    }
    .center-dot {
      fill: #4ecdc4;
      animation: pulse 4s ease-in-out infinite;
    }
    @keyframes morph {
      0%, 10% {
        d: path("M 50 20 C 75 20 80 45 65 55 C 50 65 35 55 35 45 C 35 35 50 30 55 40 C 60 50 45 60 35 55 C 25 50 20 35 30 25 C 40 15 50 20 50 20 C 50 20 25 25 20 45 C 15 65 35 80 50 80 C 65 80 85 65 80 45 C 75 25 50 20 50 20");
      }
      45%, 55% {
        d: path("M 50 15 C 70 15 85 30 85 50 C 85 70 70 85 50 85 C 30 85 15 70 15 50 C 15 30 30 15 50 15 C 50 15 70 15 85 30 C 85 30 85 70 70 85 C 70 85 30 85 15 70 C 15 70 15 30 30 15 C 30 15 50 15 50 15");
      }
      90%, 100% {
        d: path("M 50 20 C 75 20 80 45 65 55 C 50 65 35 55 35 45 C 35 35 50 30 55 40 C 60 50 45 60 35 55 C 25 50 20 35 30 25 C 40 15 50 20 50 20 C 50 20 25 25 20 45 C 15 65 35 80 50 80 C 65 80 85 65 80 45 C 75 25 50 20 50 20");
      }
    }
    @keyframes pulse {
      0%, 10% { r: 3; opacity: 1; }
      45%, 55% { r: 5; opacity: 0.8; }
      90%, 100% { r: 3; opacity: 1; }
    }
  </style>

  <!-- Animated knot path -->
  <path class="knot-path" d="M 50 20 C 75 20 80 45 65 55 C 50 65 35 55 35 45 C 35 35 50 30 55 40 C 60 50 45 60 35 55 C 25 50 20 35 30 25 C 40 15 50 20 50 20"/>

  <!-- Center dot -->
  <circle class="center-dot" cx="50" cy="50" r="3"/>
</svg>
