<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Background -->
  <rect width="120" height="120" fill="#0a0a0a"/>

  <!-- Outer connection lines (data flow) -->
  <g stroke-linecap="round" stroke-width="2">
    <!-- Top connection -->
    <line x1="60" y1="10" x2="60" y2="35" stroke="#4ecdc4" opacity="0.6"/>
    <!-- Bottom connection -->
    <line x1="60" y1="85" x2="60" y2="110" stroke="#4ecdc4" opacity="0.6"/>
    <!-- Left connection -->
    <line x1="10" y1="60" x2="35" y2="60" stroke="#4ecdc4" opacity="0.6"/>
    <!-- Right connection -->
    <line x1="85" y1="60" x2="110" y2="60" stroke="#4ecdc4" opacity="0.6"/>
    <!-- Diagonal connections -->
    <line x1="18" y1="18" x2="38" y2="38" stroke="#4ecdc4" opacity="0.4"/>
    <line x1="102" y1="18" x2="82" y2="38" stroke="#4ecdc4" opacity="0.4"/>
    <line x1="18" y1="102" x2="38" y2="82" stroke="#4ecdc4" opacity="0.4"/>
    <line x1="102" y1="102" x2="82" y2="82" stroke="#4ecdc4" opacity="0.4"/>
  </g>

  <!-- Central knot structure -->
  <g stroke="#ffb000" stroke-width="3" stroke-linecap="round" fill="none">
    <!-- The "0" shape - representing the zero in Knot0 -->
    <ellipse cx="60" cy="60" rx="20" ry="25"/>

    <!-- The knot crossings -->
    <path d="M 40 50 Q 60 60 40 70" />
    <path d="M 80 50 Q 60 60 80 70" />

    <!-- Horizontal through-line (the "tie") -->
    <line x1="35" y1="60" x2="45" y2="60"/>
    <line x1="75" y1="60" x2="85" y2="60"/>
  </g>

  <!-- Connection nodes (endpoints) -->
  <g fill="#4ecdc4">
    <circle cx="60" cy="10" r="3"/>
    <circle cx="60" cy="110" r="3"/>
    <circle cx="10" cy="60" r="3"/>
    <circle cx="110" cy="60" r="3"/>
    <circle cx="18" cy="18" r="2"/>
    <circle cx="102" cy="18" r="2"/>
    <circle cx="18" cy="102" r="2"/>
    <circle cx="102" cy="102" r="2"/>
  </g>

  <!-- Center glow point -->
  <circle cx="60" cy="60" r="4" fill="#ffb000"/>
  <circle cx="60" cy="60" r="8" fill="#ffb000" opacity="0.3"/>
</svg>
